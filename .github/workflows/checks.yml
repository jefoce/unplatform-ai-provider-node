name: checks

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "aiohttp>=3.11.8" "Pillow>=10.1.0" "av>=17.0.0" numpy

      - name: Print resolved versions
        run: |
          python -c "import importlib.metadata as m, sys; print('aiohttp', m.version('aiohttp')); print('Pillow', m.version('Pillow')); print('av', m.version('av')); print('python', sys.executable, sys.version)"

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Types
        run: python -m pyright

      - name: Tests
        run: python -m pytest -m "not comfy"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPAI_COMFY_DIR: ${{ github.workspace }}/../ComfyUI
      UPAI_COMFY_PYTHON: ${{ github.workspace }}/.venv/bin/python
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.12"

      - name: Cache venv and pip
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            .venv
            ~/.cache/pip
          key: e2e-${{ runner.os }}-py3.12-${{ hashFiles('pyproject.toml') }}-ab08f7b2caa6d4007ecde3762116c6193613f43b

      - name: Check out ComfyUI
        run: |
          git init "$UPAI_COMFY_DIR"
          git -C "$UPAI_COMFY_DIR" remote add origin https://github.com/comfyanonymous/ComfyUI.git
          git -C "$UPAI_COMFY_DIR" fetch --depth 1 origin ab08f7b2caa6d4007ecde3762116c6193613f43b
          git -C "$UPAI_COMFY_DIR" checkout --detach FETCH_HEAD
          git -C "$UPAI_COMFY_DIR" rev-parse HEAD
          mkdir -p "$UPAI_COMFY_DIR/custom_nodes"
          ln -s "$GITHUB_WORKSPACE" \
            "$UPAI_COMFY_DIR/custom_nodes/unplatform-ai-provider-node"

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            torch torchvision
          .venv/bin/python -m pip install -r "$UPAI_COMFY_DIR/requirements.txt"
          .venv/bin/python -m pip install -e ".[dev]" "aiohttp>=3.11.8" "Pillow>=10.1.0" "av>=17.0.0"

      - name: Print resolved versions
        run: |
          .venv/bin/python -c "import importlib.metadata as m, sys; print('aiohttp', m.version('aiohttp')); print('Pillow', m.version('Pillow')); print('av', m.version('av')); print('python', sys.executable, sys.version)"

      - name: E2E
        run: .venv/bin/pytest -m comfy

  workflows_lint:
    name: workflows-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.12"

      - name: Install comfy-cli
        run: python -m pip install "comfy-cli==1.25.0"

      - name: Validate node
        run: comfy node validate

  links:
    name: links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --verbose --exclude-path .venv --exclude-path .git --exclude-path node_modules './README.md' './docs/**/*.md' './workflows/**/*.md'
          fail: true

  checks-ok:
    name: checks-ok
    if: always()
    needs: [checks, e2e, workflows_lint, validate, links]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify results
        shell: bash
        run: |
          echo "checks=${{ needs.checks.result }}"
          echo "e2e=${{ needs.e2e.result }}"
          echo "workflows_lint=${{ needs.workflows_lint.result }}"
          echo "validate=${{ needs.validate.result }}"
          echo "links=${{ needs.links.result }}"
          test "${{ needs.checks.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
          test "${{ needs.workflows_lint.result }}" = "success"
          test "${{ needs.validate.result }}" = "success"
          test "${{ needs.links.result }}" = "success"
