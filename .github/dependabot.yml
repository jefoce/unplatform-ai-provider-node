version: 2

multi-ecosystem-groups:
  monthly-deps:
    schedule:
      interval: monthly
    target-branch: releases
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: deps

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: monthly-deps
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: monthly-deps
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
